name: Everyday Cloud Job Discovery & Matching

on:
  schedule:
    # Runs every morning at 03:00 UTC (08:30 AM IST) completely in the cloud!
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web/mobile UI anytime

permissions:
  contents: write

jobs:
  run-daily-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Daily Cloud Discovery & Matching Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'heuristic' }}
          DATABASE_URL: sqlite:///data/job_agent.db
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO || 'naga.teja.are@gmail.com' }}
        run: |
          python backend/run_daily.py

      - name: Upload Daily Excel & Resume Reports
        uses: actions/upload-artifact@v4
        with:
          name: daily-job-discovery-report
          path: |
            data/reports/*.xlsx
            data/tailored_resumes/*
          retention-days: 30

      - name: Commit & Push Updated Discovered Jobs to Cloud
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/job_agent.db data/reports/ data/tailored_resumes/ -f || true
          git diff --staged --quiet || (git commit -m "Automated daily cloud job discovery: $(date +'%Y-%m-%d')" && git push)

      - name: Deploy Dashboard to Firebase Hosting (Optional)
        if: env.FIREBASE_TOKEN != ''
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --token "$FIREBASE_TOKEN"
