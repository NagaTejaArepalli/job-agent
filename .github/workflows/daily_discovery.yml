name: Everyday Cloud Job Discovery & Matching

on:
  schedule:
    # Runs every morning at 03:00 UTC (08:30 AM IST) completely in the cloud!
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web/mobile UI anytime

permissions:
  contents: write

jobs:
  run-daily-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Daily Cloud Discovery & Matching Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'heuristic' }}
          DATABASE_URL: sqlite:///data/job_agent.db
        run: |
          python backend/run_daily.py

      - name: Upload Daily Excel Report
        uses: actions/upload-artifact@v4
        with:
          name: daily-job-discovery-report
          path: data/reports/*.xlsx
          retention-days: 30

      - name: Commit & Push Updated Discovered Jobs to Cloud
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/job_agent.db data/reports/ data/tailored_resumes/ -f || true
          git diff --staged --quiet || (git commit -m "Automated daily cloud job discovery: $(date +'%Y-%m-%d')" && git push)
